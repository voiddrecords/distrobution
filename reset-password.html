<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>VoidRecords — Reset Password</title>

    <link
        rel="icon"
        type="image/png"
        href="./favicon.png"
    >

    <link
        rel="stylesheet"
        href="./css/style.css"
    >

</head>

<body>

    <main class="login-page ready">

        <section class="login-panel">

            <div class="login-container">

                <div class="mobile-brand">
                    VOIDRECORDS
                </div>


                <div class="login-header">

                    <p class="eyebrow">
                        ACCOUNT SECURITY
                    </p>

                    <h1>
                        Reset password
                    </h1>

                    <p class="subtitle">
                        Create a new password for your
                        VoidRecords account.
                    </p>

                </div>


                <form id="resetPasswordForm">


                    <div class="input-group">

                        <label for="newPassword">
                            NEW PASSWORD
                        </label>

                        <input
                            type="password"
                            id="newPassword"
                            placeholder="••••••••"
                            minlength="6"
                            required
                        >

                    </div>


                    <div class="input-group">

                        <label for="confirmPassword">
                            CONFIRM PASSWORD
                        </label>

                        <input
                            type="password"
                            id="confirmPassword"
                            placeholder="••••••••"
                            minlength="6"
                            required
                        >

                    </div>


                    <p
                        id="resetMessage"
                        class="login-message"
                    ></p>


                    <button
                        type="submit"
                        class="login-button"
                        id="resetButton"
                    >

                        <span>
                            UPDATE PASSWORD
                        </span>

                        <span>
                            →
                        </span>

                    </button>

                </form>


                <div class="invite-section">

                    <button
                        type="button"
                        class="request-button"
                        id="backToLogin"
                    >
                        BACK TO LOGIN
                    </button>

                </div>


                <footer>

                    <span>
                        © 2026 VoidRecords Music & Entertainment.
                    </span>

                </footer>

            </div>

        </section>

    </main>


    <!-- SUPABASE -->

    <script
        src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
    ></script>


    <script>

        // =========================================
        // SUPABASE CONFIG
        // =========================================

        const SUPABASE_URL =
            "YOUR_SUPABASE_PROJECT_URL";


        const SUPABASE_PUBLISHABLE_KEY =
            "YOUR_SUPABASE_PUBLISHABLE_KEY";


        const supabaseClient =
            window.supabase.createClient(
                SUPABASE_URL,
                SUPABASE_PUBLISHABLE_KEY
            );


        // =========================================
        // ELEMENTS
        // =========================================

        const form =
            document.getElementById(
                "resetPasswordForm"
            );


        const message =
            document.getElementById(
                "resetMessage"
            );


        const button =
            document.getElementById(
                "resetButton"
            );


        // =========================================
        // RESET PASSWORD
        // =========================================

        form.addEventListener(
            "submit",
            async event => {

                event.preventDefault();


                const password =
                    document.getElementById(
                        "newPassword"
                    ).value;


                const confirmPassword =
                    document.getElementById(
                        "confirmPassword"
                    ).value;


                message.textContent =
                    "";


                if (
                    password.length < 6
                ) {

                    message.textContent =
                        "Password must be at least 6 characters.";

                    return;

                }


                if (
                    password !==
                    confirmPassword
                ) {

                    message.textContent =
                        "Passwords do not match.";

                    return;

                }


                button.disabled =
                    true;


                try {

                    const {
                        error
                    } =
                        await supabaseClient.auth
                            .updateUser({

                                password:
                                    password

                            });


                    if (error) {

                        throw error;

                    }


                    message.style.color =
                        "#ffffff";


                    message.textContent =
                        "Password updated successfully.";


                    setTimeout(
                        () => {

                            window.location.href =
                                "./index.html";

                        },
                        1500
                    );


                } catch (error) {

                    console.error(
                        "Password update error:",
                        error
                    );


                    message.style.color =
                        "#d00000";


                    message.textContent =
                        error.message ||
                        "Unable to update password.";


                    button.disabled =
                        false;

                }

            }
        );


        // =========================================
        // BACK TO LOGIN
        // =========================================

        document
            .getElementById(
                "backToLogin"
            )
            .addEventListener(
                "click",
                () => {

                    window.location.href =
                        "./index.html";

                }
            );

    </script>

</body>

</html>
